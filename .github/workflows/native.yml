name: native

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: C++17 core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Nori live session public-boundary compile check
        if: runner.os == 'Linux'
        run: c++ -std=c++17 -Iinclude -fsyntax-only src/native/nori_session.cpp
      - name: Install Python package
        run: python -m pip install -e ".[mcap]"
      - name: Python package unit tests
        run: python -m unittest discover -s tests
      - name: Consolidated calibration CLI smoke test
        run: |
          bividi-calib --list
          bividi-calib --dry-run stereo solve session.json --output calibration.json
          bividi-calib --dry-run stereo fisheye-evaluate session.json --output fisheye.json --candidate-id candidate --provenance synthetic
          bividi-calib --dry-run imu allan trace.csv
          bividi-calib --dry-run camera-imu import-kalibr result.yaml
      - name: Characterization comparator self-test
        run: python tools/compare_nori_characterization.py --self-test
      - name: Qualification runner self-test
        run: python tools/run_ar0234_qualification.py --self-test
      - name: Qualification campaign comparator self-test
        run: python tools/compare_qualification_campaigns.py --self-test
      - name: Calibration tool self-test suite
        run: python -m bividi.calib_selftests
      - name: Configure
        run: cmake -S . -B build -DBIVIDI_WITH_OPENCV=OFF -DBIVIDI_BUILD_VIEWER=OFF -DBIVIDI_BUILD_WEB=OFF -DBIVIDI_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  opencv:
    name: OpenCV bridge + viewer + web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV development package
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev python3-opencv python3-numpy
      - name: Stereo calibration OpenCV synthetic solver self-test
        run: python3 tools/stereo_calibration_workbench.py --self-test-opencv
      - name: Stereo fisheye candidate OpenCV synthetic solver self-test
        env:
          PYTHONPATH: src
        run: python3 -m bividi.calibration.stereo_fisheye_candidate --self-test-opencv
      - name: Configure
        run: cmake -S . -B build -DBIVIDI_WITH_OPENCV=ON -DBIVIDI_BUILD_VIEWER=ON -DBIVIDI_BUILD_WEB=ON -DBIVIDI_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
