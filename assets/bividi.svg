<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
  <title id="title">Bividi mascot</title>
  <desc id="desc">A cute stereo-inertial sensing head with two separate camera eyes, a tiny IMU badge, timing accents, and a USB-C port.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#5b463f" flood-opacity="0.17"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf4"/>
      <stop offset="1" stop-color="#ffe8d8"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f6065"/>
      <stop offset="1" stop-color="#25272c"/>
    </linearGradient>
  </defs>

  <ellipse cx="210" cy="304" rx="122" ry="14" fill="#dfe8ef" opacity="0.74"/>

  <g filter="url(#shadow)">
    <!-- sensor head body -->
    <rect x="48" y="82" width="324" height="158" rx="46" fill="url(#body)" stroke="#5b463f" stroke-width="6"/>
    <path d="M78 103 Q210 69 342 103" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.72"/>

    <!-- left camera eye -->
    <circle cx="137" cy="156" r="52" fill="#f7f1eb" stroke="#5b463f" stroke-width="6"/>
    <circle cx="137" cy="156" r="39" fill="url(#lens)" stroke="#5b463f" stroke-width="4"/>
    <circle cx="137" cy="156" r="24" fill="#8dd2e6" stroke="#fff7ef" stroke-width="5"/>
    <circle cx="143" cy="149" r="10" fill="#2d4454"/>
    <circle cx="151" cy="141" r="6" fill="#ffffff"/>
    <circle cx="132" cy="166" r="4" fill="#ffffff" opacity="0.72"/>

    <!-- right camera eye -->
    <circle cx="283" cy="156" r="52" fill="#f7f1eb" stroke="#5b463f" stroke-width="6"/>
    <circle cx="283" cy="156" r="39" fill="url(#lens)" stroke="#5b463f" stroke-width="4"/>
    <circle cx="283" cy="156" r="24" fill="#8dd2e6" stroke="#fff7ef" stroke-width="5"/>
    <circle cx="289" cy="149" r="10" fill="#2d4454"/>
    <circle cx="297" cy="141" r="6" fill="#ffffff"/>
    <circle cx="278" cy="166" r="4" fill="#ffffff" opacity="0.72"/>

    <!-- cheeks -->
    <ellipse cx="86" cy="197" rx="19" ry="9" fill="#ff9fa5" opacity="0.72"/>
    <ellipse cx="334" cy="197" rx="19" ry="9" fill="#ff9fa5" opacity="0.72"/>

    <!-- tiny IMU badge: separate from the camera eyes -->
    <rect x="185" y="111" width="50" height="36" rx="10" fill="#b9a4d8" stroke="#5b463f" stroke-width="4"/>
    <circle cx="198" cy="129" r="4" fill="#fffaf4"/>
    <circle cx="210" cy="129" r="4" fill="#fffaf4"/>
    <circle cx="222" cy="129" r="4" fill="#fffaf4"/>
    <path d="M194 108v-8 M205 108v-8 M216 108v-8 M227 108v-8 M194 150v8 M205 150v8 M216 150v8 M227 150v8" stroke="#5b463f" stroke-width="3" stroke-linecap="round"/>

    <!-- calm smile -->
    <path d="M191 199 Q210 217 229 199" fill="none" stroke="#5b463f" stroke-width="6" stroke-linecap="round"/>

    <!-- USB-C port -->
    <rect x="180" y="232" width="60" height="24" rx="12" fill="#45464b" stroke="#5b463f" stroke-width="5"/>
    <rect x="192" y="239" width="36" height="10" rx="5" fill="#dfe8ef"/>
  </g>

  <!-- stereo / timing accents -->
  <path d="M93 57 q17-20 36-3" fill="none" stroke="#83bce6" stroke-width="7" stroke-linecap="round"/>
  <path d="M291 54 q19-18 37 2" fill="none" stroke="#83bce6" stroke-width="7" stroke-linecap="round"/>
  <path d="M70 61 l-10-13 M61 78 l-17-3" stroke="#f6b93b" stroke-width="7" stroke-linecap="round"/>
  <path d="M351 61 l10-13 M360 78 l17-3" stroke="#f6b93b" stroke-width="7" stroke-linecap="round"/>

  <!-- sync pulse -->
  <path d="M118 278 h31 l8-18 14 36 14-27 10 9 h107" fill="none" stroke="#b9a4d8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
