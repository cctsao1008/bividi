<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Bividi mascot</title>
  <desc id="desc">A warm hand-drawn pair of little eyes representing two grounded views of one world.</desc>

  <!-- warm paper-like face -->
  <path d="M77 98 Q88 58 143 50 Q255 37 369 49 Q424 56 438 104 Q454 184 448 280 Q444 377 410 418 Q372 456 278 460 Q168 464 111 438 Q68 417 59 357 Q48 277 58 189 Q63 133 77 98Z" fill="#FFD7BE"/>

  <!-- left eye, intentionally slightly irregular -->
  <path d="M103 251 Q105 183 149 156 Q190 130 226 161 Q255 187 253 249 Q251 312 214 340 Q175 369 137 338 Q104 309 103 251Z" fill="#FFF9ED" stroke="#7A3E22" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- right eye -->
  <path d="M273 249 Q275 184 317 157 Q356 132 394 159 Q427 184 426 248 Q425 310 390 339 Q352 369 311 339 Q274 311 273 249Z" fill="#FFF9ED" stroke="#7A3E22" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- amber irises -->
  <path d="M145 250 Q145 214 173 200 Q202 191 219 219 Q230 242 218 271 Q205 298 174 297 Q145 293 145 250Z" fill="#F8B84E"/>
  <path d="M315 249 Q316 214 344 201 Q374 191 390 219 Q401 244 389 272 Q376 298 346 296 Q316 293 315 249Z" fill="#F8B84E"/>

  <!-- pupils -->
  <circle cx="181" cy="249" r="27" fill="#6B351F"/>
  <circle cx="352" cy="249" r="27" fill="#6B351F"/>
  <circle cx="191" cy="238" r="9" fill="#FFFDF8"/>
  <circle cx="362" cy="238" r="9" fill="#FFFDF8"/>

  <!-- little nose and smile -->
  <path d="M256 249 Q250 261 256 274" fill="none" stroke="#7A3E22" stroke-width="11" stroke-linecap="round"/>
  <path d="M232 321 Q256 341 282 319" fill="none" stroke="#7A3E22" stroke-width="11" stroke-linecap="round"/>

  <!-- rosy cheeks -->
  <path d="M89 318 Q112 302 136 317 Q137 337 111 342 Q89 340 89 318Z" fill="#F58C8F" opacity="0.83"/>
  <path d="M377 317 Q399 302 423 317 Q424 337 398 342 Q378 339 377 317Z" fill="#F58C8F" opacity="0.83"/>
  <path d="M99 323 l15 -5 M105 333 l17 -6 M386 324 l15 -5 M392 334 l17 -6" stroke="#E96872" stroke-width="5" stroke-linecap="round" opacity="0.72"/>

  <!-- tiny discovery marks -->
  <path d="M380 112 Q389 93 396 78" stroke="#F5A623" stroke-width="10" stroke-linecap="round"/>
  <path d="M408 126 Q423 111 434 101" stroke="#F5A623" stroke-width="10" stroke-linecap="round"/>
  <path d="M422 153 Q441 147 452 143" stroke="#F5A623" stroke-width="10" stroke-linecap="round"/>

  <!-- subtle second-pass strokes for a hand-drawn feel -->
  <path d="M106 253 Q108 188 151 160" fill="none" stroke="#8B4A2B" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  <path d="M276 251 Q279 189 319 161" fill="none" stroke="#8B4A2B" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
</svg>
